{% if test_ok %}
<div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:14px 16px;">
  <div style="display:flex;align-items:flex-start;gap:10px;">
    <span style="font-size:22px;">✅</span>
    <div>
      <h4 style="font-size:14px;font-weight:600;color:#065f46;margin-bottom:4px;">连接测试通过</h4>
      <p style="font-size:13px;color:#065f46;margin:0;">{{ test_message }}</p>
      {% if test_endpoint %}
      <p class="text-sm" style="margin-top:6px;color:#047857;">端点：{{ test_endpoint }}</p>
      {% endif %}
    </div>
  </div>
</div>
{% else %}
<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px 16px;">
  <div style="display:flex;align-items:flex-start;gap:10px;">
    <span style="font-size:22px;">❌</span>
    <div>
      <h4 style="font-size:14px;font-weight:600;color:#991b1b;margin-bottom:4px;">连接测试失败</h4>
      <p style="font-size:13px;color:#991b1b;margin:0;">{{ test_message }}</p>
      {% if test_endpoint %}
      <p class="text-sm" style="margin-top:6px;color:#7f1d1d;">尝试端点：{{ test_endpoint }}</p>
      {% endif %}
      {% if test_model %}
      <p class="text-sm" style="margin-top:2px;color:#7f1d1d;">尝试模型：{{ test_model }}</p>
      {% endif %}
    </div>
  </div>
</div>
{% endif %}
